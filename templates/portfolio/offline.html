{% extends 'base.html' %}

{% block content %}
<main class="offline-page">
    <section class="container">
        <div class="offline-panel">
            <p class="offline-panel__eyebrow">Нет соединения</p>
            <h1>Сайт временно открыт из кеша</h1>
            <p>
                Интернет пропал или сервер не отвечает. Проверь подключение и обнови страницу:

            <a href="{% url 'home' %}" class="btn btn-primary">
                Вернуться на главную
            </a>
        </div>
    </section>
</main>
{% endblock %}
