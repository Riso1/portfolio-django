{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.full_name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
</head>
<body>

<header class="border-bottom">
    <nav class="container navbar navbar-expand-lg">
        <a class="navbar-brand fw-bold" href="/">
            {{ settings.full_name }}
        </a>

        <div class="ms-auto">
            <a href="#projects" class="btn btn-link text-dark text-decoration-none">
                Проекты
            </a>

            <a href="#certificates" class="btn btn-link text-dark text-decoration-none">
                Сертификаты
            </a>

            {% if settings.resume %}
                <a href="{{ settings.resume.url }}" class="btn btn-outline-light btn-sm">
                    Скачать резюме
                </a>
            {% endif %}
        </div>
    </nav>
</header>

{% block content %}
{% endblock %}

</body>
</html>
