{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.full_name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
</head>
<body>

<header class="site-header sticky-top">
    <nav class="container navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand fw-bold" href="/">
            {{ settings.full_name }}
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Открыть меню">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <a href="#about" class="nav-link">Обо мне</a>
                <a href="#technologies" class="nav-link">Технологии</a>
                <a href="#projects" class="nav-link">Проекты</a>
                <a href="#certificates" class="nav-link">Сертификаты</a>
                <a href="#contacts" class="nav-link">Контакты</a>

                {% if settings.resume %}
                    <a href="{{ settings.resume.url }}"
                       class="btn btn-outline-light btn-sm ms-lg-2 mt-2 mt-lg-0">
                        Скачать резюме
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>
</header>

{% block content %}
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
